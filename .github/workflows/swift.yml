name: CI

on: [push, pull_request]

jobs:
  macOS:
    runs-on: macOS-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
    - name: Build and Test
      run: swift test
      
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tag: ['6.0', '6.1', '6.2']
    container:
      image: swift:${{ matrix.tag }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
    - name: Build and Test
      run: swift test
    
